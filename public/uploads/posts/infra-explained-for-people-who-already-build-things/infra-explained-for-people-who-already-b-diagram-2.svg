<svg xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" viewBox="0 0 560 190" role="img" aria-label="Diagram: visitors reach a reverse proxy, which reads the hostname and forwards each request to the matching app" style="display:block;width:100%;max-width:560px;height:auto;margin:0 auto">
<defs><marker id="arrC" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#475569" fill-opacity=".55"></path></marker></defs>
<rect class="box" x="20" y="75" width="100" height="40" rx="8" fill="#475569" fill-opacity=".05" stroke="#475569" stroke-opacity=".28"></rect>
<text x="70" y="99" text-anchor="middle" fill="#475569" font-size="12">Visitors</text>
