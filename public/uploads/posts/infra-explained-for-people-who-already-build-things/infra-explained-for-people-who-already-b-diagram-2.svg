<text x="470" y="93" text-anchor="middle" fill="#475569" font-size="12">Uptime Kuma</text>
<text x="470" y="107" text-anchor="middle" class="t-muted" fill="#475569" font-size="11" fill-opacity=".65">uptime.farhan.app</text>
<rect class="box" x="400" y="132" width="140" height="38" rx="8" fill="#475569" fill-opacity=".05" stroke="#475569" stroke-opacity=".28"></rect>
<text x="470" y="149" text-anchor="middle" fill="#475569" font-size="12">WordPress</text>
