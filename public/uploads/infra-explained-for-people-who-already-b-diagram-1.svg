<svg xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" viewBox="0 0 560 150" role="img" aria-label="Diagram: your laptop connects to a server in a data centre over SSH, encrypted, on port 22" style="display:block;width:100%;max-width:560px;height:auto;margin:0 auto">
<defs><marker id="arrA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#475569" fill-opacity=".55"></path></marker></defs>
<rect class="box" x="20" y="45" width="150" height="60" rx="8" fill="#475569" fill-opacity=".05" stroke="#475569" stroke-opacity=".28"></rect>
<text x="95" y="70" text-anchor="middle" fill="#475569" font-size="12">Your laptop</text>
<text x="95" y="88" text-anchor="middle" class="t-muted" fill="#475569" font-size="11" fill-opacity=".65">a terminal window</text>
<rect class="box-accent" x="390" y="35" width="150" height="80" rx="8" fill="#2563eb" fill-opacity=".1" stroke="#2563eb"></rect>
<text x="465" y="63" text-anchor="middle" fill="#475569" font-size="12">A server</text>
<text x="465" y="81" text-anchor="middle" class="t-muted" fill="#475569" font-size="11" fill-opacity=".65">always-on computer</text>
<text x="465" y="97" text-anchor="middle" class="t-muted" fill="#475569" font-size="11" fill-opacity=".65">in a data centre</text>
<line class="arrow" x1="175" y1="75" x2="383" y2="75" marker-end="url(#arrA)" stroke="#475569" stroke-opacity=".55" fill="none" stroke-width="1.5"></line>
<text x="279" y="62" text-anchor="middle" class="t-accent" fill="#2563eb" font-size="12" font-weight="600">SSH</text>
<text x="279" y="95" text-anchor="middle" class="t-muted" fill="#475569" font-size="11" fill-opacity=".65">typed commands, encrypted</text>
</svg>